<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="JSE Stock Analysis and Backtesting System">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#22c55e"/><stop offset="0.5" stop-color="#4ade80"/><stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.34"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.82"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gY" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#facc15" stop-opacity="0.20"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#16211c" stroke-width="1"/></pattern>
    <clipPath id="wc"><text x="76" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5">JSE Analytics</text></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="sm"><rect width="1200" height="300" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="300" fill="#080d0a"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.65"/>
  <ellipse cx="120" cy="16" rx="470" ry="270" fill="url(#gG)"/>
  <ellipse cx="1050" cy="290" rx="500" ry="290" fill="url(#gY)"/>

  <g mask="url(#sm)">
    <rect x="0" y="0" width="1200" height="2" fill="#22c55e">
      <animate attributeName="y" values="18;282;18" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="8.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="76" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5" fill="url(#brand)">JSE Analytics</text>
  <g clip-path="url(#wc)">
    <rect x="-300" y="66" width="180" height="130" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;760" dur="3.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="79" y="178" font-family="JetBrains Mono,Courier New,monospace" font-size="16.5" letter-spacing="3.6" fill="#94a3b8">STOCK ANALYSIS &amp; BACKTESTING SYSTEM</text>

  <g font-family="JetBrains Mono,Courier New,monospace" font-size="13" font-weight="600">
    <g transform="translate(79,202)"><rect width="106" height="28" rx="14" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.38"/><text x="53" y="18.5" text-anchor="middle" fill="#4ade80">245+ STOCKS</text></g>
    <g transform="translate(195,202)"><rect width="98" height="28" rx="14" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.38"/><text x="49" y="18.5" text-anchor="middle" fill="#4ade80">5Y HISTORY</text></g>
    <g transform="translate(303,202)"><rect width="112" height="28" rx="14" fill="#facc15" fill-opacity="0.10" stroke="#facc15" stroke-opacity="0.38"/><text x="56" y="18.5" text-anchor="middle" fill="#fde047">SEASONALITY</text></g>
  </g>

  <g fill="#22c55e" opacity="0.30">
    <rect x="700" y="214" width="12" height="20" rx="2"><animate attributeName="height" values="8;20;8" dur="4.1s" repeatCount="indefinite"/><animate attributeName="y" values="226;214;226" dur="4.1s" repeatCount="indefinite"/></rect>
    <rect x="730" y="206" width="12" height="28" rx="2"><animate attributeName="height" values="14;28;14" dur="3.6s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="y" values="220;206;220" dur="3.6s" begin="-0.6s" repeatCount="indefinite"/></rect>
    <rect x="760" y="218" width="12" height="16" rx="2"><animate attributeName="height" values="16;26;16" dur="4.6s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="y" values="218;208;218" dur="4.6s" begin="-1.3s" repeatCount="indefinite"/></rect>
    <rect x="790" y="202" width="12" height="32" rx="2"><animate attributeName="height" values="20;32;20" dur="3.9s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="y" values="214;202;214" dur="3.9s" begin="-2.1s" repeatCount="indefinite"/></rect>
    <rect x="820" y="212" width="12" height="22" rx="2"><animate attributeName="height" values="10;22;10" dur="4.3s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="y" values="224;212;224" dur="4.3s" begin="-0.9s" repeatCount="indefinite"/></rect>
    <rect x="850" y="196" width="12" height="38" rx="2"><animate attributeName="height" values="24;38;24" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/><animate attributeName="y" values="210;196;210" dur="3.4s" begin="-1.7s" repeatCount="indefinite"/></rect>
    <rect x="880" y="208" width="12" height="26" rx="2"><animate attributeName="height" values="12;26;12" dur="4.8s" begin="-2.6s" repeatCount="indefinite"/><animate attributeName="y" values="222;208;222" dur="4.8s" begin="-2.6s" repeatCount="indefinite"/></rect>
    <rect x="910" y="200" width="12" height="34" rx="2"><animate attributeName="height" values="18;34;18" dur="3.8s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="y" values="216;200;216" dur="3.8s" begin="-0.3s" repeatCount="indefinite"/></rect>
    <rect x="940" y="190" width="12" height="44" rx="2"><animate attributeName="height" values="28;44;28" dur="4.2s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="y" values="206;190;206" dur="4.2s" begin="-1.1s" repeatCount="indefinite"/></rect>
    <rect x="970" y="204" width="12" height="30" rx="2"><animate attributeName="height" values="16;30;16" dur="3.5s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="y" values="218;204;218" dur="3.5s" begin="-2.4s" repeatCount="indefinite"/></rect>
    <rect x="1000" y="186" width="12" height="48" rx="2"><animate attributeName="height" values="30;48;30" dur="4.5s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="y" values="204;186;204" dur="4.5s" begin="-0.8s" repeatCount="indefinite"/></rect>
    <rect x="1030" y="198" width="12" height="36" rx="2"><animate attributeName="height" values="20;36;20" dur="3.7s" begin="-1.9s" repeatCount="indefinite"/><animate attributeName="y" values="214;198;214" dur="3.7s" begin="-1.9s" repeatCount="indefinite"/></rect>
    <rect x="1060" y="182" width="12" height="52" rx="2"><animate attributeName="height" values="34;52;34" dur="4.0s" begin="-1.4s" repeatCount="indefinite"/><animate attributeName="y" values="200;182;200" dur="4.0s" begin="-1.4s" repeatCount="indefinite"/></rect>
    <rect x="1090" y="192" width="12" height="42" rx="2"><animate attributeName="height" values="24;42;24" dur="3.3s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="y" values="210;192;210" dur="3.3s" begin="-0.5s" repeatCount="indefinite"/></rect>
  </g>

  <path d="M706 172 L736 158 L766 166 L796 138 L826 148 L856 116 L886 128 L916 96 L946 106 L976 78 L1006 88 L1036 62 L1066 70 L1096 48 L1096 176 L706 176 Z" fill="url(#area)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0.95;0" keyTimes="0;0.42;0.62;0.9;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M706 172 L736 158 L766 166 L796 138 L826 148 L856 116 L886 128 L916 96 L946 106 L976 78 L1006 88 L1036 62 L1066 70 L1096 48"
        fill="none" stroke="url(#line)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="620" stroke-dashoffset="620">
    <animate attributeName="stroke-dashoffset" values="620;0;0;620" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <circle cx="1096" cy="48" r="6" fill="#facc15" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.5;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(706,258)" font-family="JetBrains Mono,Courier New,monospace">
    <circle r="5" fill="#4ade80"><animate attributeName="opacity" values="1;0.35;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="none" stroke="#4ade80" stroke-width="1.5"><animate attributeName="r" values="5;16" dur="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="1.9s" repeatCount="indefinite"/></circle>
    <text x="16" y="4" font-size="13" letter-spacing="1.5" fill="#4ade80">MOMENTUM  ·  VECTORIZED BACKTEST</text>
  </g>
</svg>
